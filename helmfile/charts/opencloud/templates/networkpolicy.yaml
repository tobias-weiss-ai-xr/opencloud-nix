{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opencloud.fullname" . }}-network-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opencloud.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opencloud.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  egress:
    # DNS
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    # traffic to sibling OpenCloud pods (e.g. for scaling/events)
    - to:
        - podSelector:
            matchLabels:
              {{- include "opencloud.selectorLabels" . | nindent 14 }}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "opencloud.selectorLabels" . | nindent 14 }}
    # Allow ingress controllers from any namespace (nginx, traefik, haproxy, ...)
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
