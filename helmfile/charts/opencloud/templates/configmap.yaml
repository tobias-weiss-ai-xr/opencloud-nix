{{- if .Values.config.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opencloud.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opencloud.labels" . | nindent 4 }}
data:
  # Canonical OpenCloud 9.x development config — mirrors what
  # `opencloud init --insecure yes` generates (see config/opencloud.yaml in
  # this repository). The five token/machine secrets are injected via
  # environment (Secret "…-secrets"); system_user_id/admin_user_id are kept
  # stable per release so the internal IDM provisions matching identities.
  opencloud.yaml: |
    token_manager:
      jwt_secret: "override-via-env"
      machine_auth_api_key: "override-via-env"
      system_user_api_key: "override-via-env"
      transfer_secret: "override-via-env"
      url_signing_secret: "override-via-env"
      system_user_id: {{ .Values.systemUserId | quote }}
      admin_user_id: {{ .Values.adminUserId | quote }}
    graph:
      application:
        id: {{ .Values.graphApplicationId | quote }}
      events:
        tls_insecure: true
      spaces:
        insecure: true
      identity:
        ldap:
{{- if .Values.graph.ldap.enabled }}
          uri: {{ .Values.graph.ldap.uri | quote }}
          bind_dn: {{ .Values.graph.ldap.bind_dn | quote }}
          bind_password: {{ .Values.graph.ldap.bind_password | quote }}
          base_dn: {{ .Values.graph.ldap.base_dn | quote }}
          scope: {{ .Values.graph.ldap.scope | quote }}
          user_schema:
            id: {{ .Values.graph.ldap.user_schema.id | quote }}
            displayName: {{ .Values.graph.ldap.user_schema.displayName | quote }}
            mail: {{ .Values.graph.ldap.user_schema.mail | quote }}
            name: {{ .Values.graph.ldap.user_schema.name | quote }}
          group_schema:
            id: {{ .Values.graph.ldap.group_schema.id | quote }}
            mail: {{ .Values.graph.ldap.group_schema.mail | quote }}
            member: {{ .Values.graph.ldap.group_schema.member | quote }}
          write_disabled: {{ .Values.graph.ldap.write_disabled }}
{{- else }}
          # internal IDM — same generated password as idm.service_user_passwords
          bind_password: "JrGpZLYg%ZYunrg!..mNQuR%o3pelYx3"
          write_disabled: false
{{- end }}
      service_account:
        service_account_id: {{ .Values.serviceAccountId | quote }}
        service_account_secret: "&70yt@bkIo6xY5rtab0lR%mV%zMX*UWb"
    idp:
      ldap:
        bind_password: "0D+MjP6kl&Che&!r7OjO4zif2t.TdMyT"
    idm:
      service_user_passwords:
        admin_password: {{ .Values.idmAdminPassword | default "admin" | quote }}
        idm_password: "JrGpZLYg%ZYunrg!..mNQuR%o3pelYx3"
        reva_password: "^SSawXD9IMbYC-q9cs*%wIuX9QmVrR^r"
        idp_password: "0D+MjP6kl&Che&!r7OjO4zif2t.TdMyT"
    collaboration:
      wopi:
        secret: "1Ok6d%9JAy2.Apv^01Y!EpR%+y03F3uV"
      app:
        insecure: true
    proxy:
      oidc:
        insecure: true
      insecure_backends: true
      service_account:
        service_account_id: {{ .Values.serviceAccountId | quote }}
        service_account_secret: "&70yt@bkIo6xY5rtab0lR%mV%zMX*UWb"
    frontend:
      app_handler:
        insecure: true
      archiver:
        insecure: true
      service_account:
        service_account_id: {{ .Values.serviceAccountId | quote }}
        service_account_secret: "&70yt@bkIo6xY5rtab0lR%mV%zMX*UWb"
      ocdav:
        insecure: true
    auth_basic:
      auth_providers:
        ldap:
          bind_password: "^SSawXD9IMbYC-q9cs*%wIuX9QmVrR^r"
    auth_bearer:
      auth_providers:
        oidc:
          insecure: true
    users:
      drivers:
        ldap:
{{- if .Values.graph.ldap.enabled }}
          uri: {{ .Values.graph.ldap.uri | quote }}
          bind_dn: {{ .Values.graph.ldap.bind_dn | quote }}
          bind_password: {{ .Values.graph.ldap.bind_password | quote }}
          base_dn: {{ .Values.graph.ldap.base_dn | quote }}
          scope: {{ .Values.graph.ldap.scope | quote }}
          user_schema:
            id: {{ .Values.graph.ldap.user_schema.id | quote }}
            displayName: {{ .Values.graph.ldap.user_schema.displayName | quote }}
            mail: {{ .Values.graph.ldap.user_schema.mail | quote }}
            name: {{ .Values.graph.ldap.user_schema.name | quote }}
          write_disabled: {{ .Values.graph.ldap.write_disabled }}
{{- else }}
          bind_password: "^SSawXD9IMbYC-q9cs*%wIuX9QmVrR^r"
          write_disabled: false
{{- end }}
    groups:
      drivers:
        ldap:
{{- if .Values.graph.ldap.enabled }}
          uri: {{ .Values.graph.ldap.uri | quote }}
          bind_dn: {{ .Values.graph.ldap.bind_dn | quote }}
          bind_password: {{ .Values.graph.ldap.bind_password | quote }}
          base_dn: {{ .Values.graph.ldap.base_dn | quote }}
          scope: {{ .Values.graph.ldap.scope | quote }}
          group_schema:
            id: {{ .Values.graph.ldap.group_schema.id | quote }}
            mail: {{ .Values.graph.ldap.group_schema.mail | quote }}
            member: {{ .Values.graph.ldap.group_schema.member | quote }}
          write_disabled: {{ .Values.graph.ldap.write_disabled }}
{{- else }}
          bind_password: "^SSawXD9IMbYC-q9cs*%wIuX9QmVrR^r"
          write_disabled: false
{{- end }}
    auth_guest:
      service_account:
        service_account_id: {{ .Values.serviceAccountId | quote }}
        service_account_secret: "&70yt@bkIo6xY5rtab0lR%mV%zMX*UWb"
    ocm:
      service_account:
        service_account_id: {{ .Values.serviceAccountId | quote }}
        service_account_secret: "&70yt@bkIo6xY5rtab0lR%mV%zMX*UWb"
    search:
      events:
        tls_insecure: true
      service_account:
        service_account_id: {{ .Values.serviceAccountId | quote }}
        service_account_secret: "&70yt@bkIo6xY5rtab0lR%mV%zMX*UWb"
    audit:
      events:
        tls_insecure: true
    settings:
      service_account_ids:
      - {{ .Values.serviceAccountId | quote }}
    sharing:
      events:
        tls_insecure: true
      service_account:
        service_account_id: {{ .Values.serviceAccountId | quote }}
        service_account_secret: "&70yt@bkIo6xY5rtab0lR%mV%zMX*UWb"
    storage_users:
      events:
        tls_insecure: true
      mount_id: {{ .Values.storageUsersMountId | quote }}
      service_account:
        service_account_id: {{ .Values.serviceAccountId | quote }}
        service_account_secret: "&70yt@bkIo6xY5rtab0lR%mV%zMX*UWb"
    notifications:
      notifications:
        events:
          tls_insecure: true
      service_account:
        service_account_id: {{ .Values.serviceAccountId | quote }}
        service_account_secret: "&70yt@bkIo6xY5rtab0lR%mV%zMX*UWb"
    nats:
      nats:
        tls_skip_verify_client_cert: true
    gateway:
      storage_registry:
        storage_users_mount_id: {{ .Values.storageUsersMountId | quote }}
    userlog:
      service_account:
        service_account_id: {{ .Values.serviceAccountId | quote }}
        service_account_secret: "&70yt@bkIo6xY5rtab0lR%mV%zMX*UWb"
    auth_service:
      service_account:
        service_account_id: {{ .Values.serviceAccountId | quote }}
        service_account_secret: "&70yt@bkIo6xY5rtab0lR%mV%zMX*UWb"
    clientlog:
      service_account:
        service_account_id: {{ .Values.serviceAccountId | quote }}
        service_account_secret: "&70yt@bkIo6xY5rtab0lR%mV%zMX*UWb"
    activitylog:
      service_account:
        service_account_id: {{ .Values.serviceAccountId | quote }}
        service_account_secret: "&70yt@bkIo6xY5rtab0lR%mV%zMX*UWb"
    webfinger:
      insecure: true
{{- with .Values.config.extra }}
{{ toYaml . | nindent 4 }}
{{- end }}

  csp.yaml: |
    directives:
      child-src:
        - "'self'"
      connect-src:
        - "'self'"
        - "blob:"
        - "https://raw.githubusercontent.com/opencloud-eu/awesome-apps/"
        - "https://update.opencloud.eu/"
        - "https://{{ include "opencloud.ingressHost" . }}"
{{- if .Values.oidc.enabled }}
        - "{{ .Values.oidc.issuer | regexFind "^https://[^/]+" }}"
{{- end }}
      default-src:
        - "'none'"
      font-src:
        - "'self'"
      frame-ancestors:
        - "'self'"
      frame-src:
        - "'self'"
        - "blob:"
        - "https://embed.diagrams.net/"
      img-src:
        - "'self'"
        - "data:"
        - "blob:"
        - "https://raw.githubusercontent.com/opencloud-eu/awesome-apps/"
      manifest-src:
        - "'self'"
      media-src:
        - "'self'"
      object-src:
        - "'self'"
        - "blob:"
      script-src:
        - "'self'"
        - "'unsafe-inline'"
      style-src:
        - "'self'"
        - "'unsafe-inline'"
{{- end }}
