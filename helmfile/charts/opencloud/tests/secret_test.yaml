suite: secret
templates:
  - secret.yaml
release:
  name: opencloud
tests:
  - it: creates a Secret with pinned values
    values:
      - ../ci/ci-values.yaml
    set:
      jwtSecret: fixed-jwt
      transferSecret: fixed-transfer
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.oc-jwt-secret
          value: fixed-jwt
      - equal:
          path: stringData.oc-transfer-secret
          value: fixed-transfer
      - exists:
          path: stringData.oc-machine-auth-api-key
      - exists:
          path: stringData.oc-system-user-api-key
      - exists:
          path: stringData.oc-url-signing-secret
