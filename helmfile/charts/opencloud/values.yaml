# It is recommended to use the Nix-built image
# (nix build .#opencloud-image; docker load < result) pushed to your registry.
replicaCount: 1

image:
  registry: ghcr.io/tobias-weiss-ai-xr
  repository: opencloud
  tag: 9.1.0
  pullPolicy: IfNotPresent

# Mount the config(opencloud.yaml) ConfigMap generated by this chart.
config:
  enabled: true
  # Extra top-level keys merged into opencloud.yaml (raw YAML).
  # Example:
  #   extra:
  #     oc_url: https://cloud.example.com
  extra: {}

podAnnotations: {}

# Pod-level security context (fsGroup makes the PVC writable for uid 1000).
securityContext:
  fsGroup: 1000

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 9200
  annotations: {}

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: cloud.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # Example:
  # tls:
  #   - secretName: cloud-tls
  #     hosts:
  #       - cloud.example.com

persistence:
  enabled: true
  size: 100Gi
  accessMode: ReadWriteOnce
  storageClass: ""
  annotations: {}

# External OIDC provider (Keycloak, Dex, ...). Disabled by default — with
# oidc.enabled=false OpenCloud uses the built-in identity management (IDM) and
# basic-auth login (PROXY_ENABLE_BASIC_AUTH=true), which is demo-friendly.
oidc:
  enabled: false
  issuer: ""
  internalIssuer: ""
  clientId: ""
  clientSecret: ""   # fallback: {{NAME}}-secrets / oc-oidc-client-secret
  autoProvisionAccounts: "true"
  roleAssignmentDriver: "oidc"
  rewriteWellknown: "true"
  userOidcClaim: "preferred_username"
  userCs3Claim: "sub"
  autoProvisionClaimUsername: "preferred_username"
  adminUserId: ""
  defaultAssignments: "false"
  assignDefaultUserRole: "false"
  usernameMatch: "none"
  excludeRunServices: "idp,idm,auth-basic"
  accountEditLink: ""

logLevel: info

# ---------------------------------------------------------------------------
# Secrets — prefer injecting them via the helmfile environment (SOPS / env).
# When empty, the chart generates random values once per install
# (randAlphaNum). For multi-replica or upgrades, pin them explicitly.
# ---------------------------------------------------------------------------
jwtSecret: ""
transferSecret: ""
machineAuthApiKey: ""
systemUserApiKey: ""
systemUserId: "admin"
urlSigningSecret: ""

# Instance identifiers inside opencloud.yaml — change per deployment.
serviceAccountId: "dc3eee3e-7831-45e4-b986-8e470f37ac23"
storageUsersMountId: "ca65db73-407e-43ca-b393-9b141f43aa8f"
graphApplicationId: "fdfc30d2-5cc5-40a4-8beb-ce6801bbca41"

graph:
  ldap:
    # Set enabled: true to use an external LDAP server as identity backend.
    enabled: false
    uri: "ldap://ldap.example.com:389"
    bind_dn: "cn=admin,dc=example,dc=com"
    bind_password: ""
    base_dn: "dc=example,dc=com"
    scope: sub
    user_schema:
      id: uid
      displayName: cn
      mail: mail
      name: givenName
    group_schema:
      id: cn
      mail: mail
      member: member
    write_disabled: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

nodeSelector: {}

tolerations: []

affinity: {}

# DNS host aliases (for clusters where CoreDNS cannot resolve external CNAME chains)
hostAliases: []

resources:
  requests:
    cpu: 256m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

networkPolicy:
  enabled: true

pdb:
  enabled: true
  minAvailable: 1

# Prometheus ServiceMonitor (monitoring.coreos.com CRD must be installed)
monitoring:
  enabled: false
  interval: 30s
  path: /status.php
  port: http
  labels:
    release: kube-prometheus-stack

# Email notifications via SMTP (optional)
notifications:
  smtp:
    host: ""
    port: 587
    sender: "noreply@example.com"
    username: ""
    # password is wired through the {{NAME}}-secrets Secret when username is set
